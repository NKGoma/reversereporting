  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#main">Zum Inhalt</a>
  <header class="top">
    <div class="top-inner">
      <button class="brand" data-act="home" type="button" aria-label="Zur Startseite">

      </button>
      <div class="top-actions">
        <button class="ai-pill" id="ai-pill" data-act="open-settings" type="button"></button>

      </div>
    </div>
    <nav class="rail" id="rail" aria-label="Arbeitsschritte"></nav>

  <main id="main" class="main" tabindex="-1"></main>

  <footer class="foot">
    <p><span class="badge badge-demo">Demo</span> Offline-Prototyp: Aktuelle Werte, Kontakte, Antworten und Transkripte sind simuliert, sofern nicht der KI-Modus mit Websuche genutzt wird. Es werden keine E-Mails versendet und keine Anrufe geführt. Alle Daten bleiben im Browser.</p>
